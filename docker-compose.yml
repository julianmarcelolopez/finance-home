version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    env_file: .env
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    env_file: .env
    depends_on:
      - api

volumes:
  api_node_modules:
  web_node_modules:
